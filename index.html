<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explorer - Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
    }
    nav {
      background-color: #2c3e50;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .search-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    nav input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    nav button {
      padding: 8px 14px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    nav button:hover {
      background-color: #d35400;
    }
    .btn-clear {
      background-color: #7f8c8d;
    }
    .btn-clear:hover {
      background-color: #95a5a6;
    }
    .hero {
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1200&q=80') center/cover;
      color: white;
      padding: 80px 20px;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }
    .hero p {
      font-size: 1.1rem;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .results-container {
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    .card h3 {
      margin-bottom: 10px;
      color: #2c3e50;
    }
    .card p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar containing required elements -->
  <nav>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="Search beaches, temples, country...">
      <button onclick="searchRecommendations()">Search</button>
      <button class="btn-clear" onclick="clearResults()">Clear</button>
    </div>
  </nav>

  <!-- Introduction / Hero Section -->
  <section class="hero">
    <h1>Explore Your Dream Destinations</h1>
    <p>Welcome to Travel Explorer! Your ultimate guide to discovering breathtaking beaches, historic temples, and incredible countries worldwide. Use our search bar above to find personalized recommendations for your next getaway.</p>
  </section>

  <!-- Container for dynamic search results -->
  <main class="results-container" id="results"></main>

  <script src="travel_recommendation.js"></script>
</body>
</html>
