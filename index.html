<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explorer - Home</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
    nav { background-color: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .search-container { display: flex; gap: 10px; }
    .search-container input { padding: 8px; border: none; border-radius: 4px; }
    .search-container button { padding: 8px 12px; background-color: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1488646953014-85cb44e25828') center/cover; color: white; padding: 80px 20px; text-align: center; }
    .results-container { padding: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; text-align: center; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo"><h2>Travel Explorer</h2></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search beaches, temples, country...">
      <button onclick="searchRecommendations()">Search</button>
      <button onclick="clearResults()" style="background-color: #7f8c8d;">Clear</button>
    </div>
  </nav>

  <!-- Hero & Introduction -->
  <section class="hero">
    <h1>Explore Your Dream Destinations</h1>
    <p>Welcome to Travel Explorer! Your ultimate guide to discovering breathtaking beaches, historic temples, and incredible countries worldwide. Use our search bar above to find personalized recommendations for your next getaway.</p>
  </section>

  <!-- Search Results Area -->
  <main class="results-container" id="results"></main>

  <script src="travel_recommendation.js"></script>
</body>
</html>
