<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explorer - Contact Us</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
    nav { background-color: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #e67e22; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo"><h2>Travel Explorer</h2></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </nav>

  <!-- Contact Form -->
  <div class="container">
    <h1>Contact Us</h1>
    <p>Have questions or need custom travel advice? Send us a message!</p>
    <form onsubmit="alert('Thank you for contacting us!'); return false;">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email address">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" required placeholder="Write your message here..."></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
  </div>

</body>
</html>
