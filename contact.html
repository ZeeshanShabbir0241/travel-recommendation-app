
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom - Contact Us</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 15px 40px;
    }
    .logo { font-size: 24px; font-weight: bold; color: #00bcd4; }
    .nav-links { display: flex; list-style: none; gap: 20px; }
    .nav-links a { color: #fff; text-decoration: none; font-size: 16px; }
    .nav-links a:hover { color: #00bcd4; }
    .container { max-width: 600px; margin: 40px auto; padding: 20px; flex: 1; }
    .contact-form { background-color: rgba(0, 0, 0, 0.75); padding: 30px; border-radius: 8px; }
    .contact-form h2 { color: #00bcd4; margin-bottom: 10px; }
    .contact-info { margin-bottom: 20px; font-size: 14px; line-height: 1.6; color: #e0e0e0; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 4px; border: none; outline: none; }
    .form-group textarea { height: 100px; resize: vertical; }
    .btn-submit { background-color: #00bcd4; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
    footer { text-align: center; padding: 15px; background-color: rgba(0, 0, 0, 0.9); margin-top: auto; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">TravelBloom</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="contact-form">
      <h2>Contact Us</h2>
      <div class="contact-info">
        <p><strong>Email:</strong> contact@travelbloom.com</p>
        <p><strong>Phone:</strong> +1 (800) 555-TRAV</p>
        <p><strong>Address:</strong> 100 Travel Way, Suite 400, San Francisco, CA</p>
      </div>
      <form id="contactForm" onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required placeholder="Your Full Name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="your.email@example.com">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" required placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 TravelBloom. All rights reserved.</p>
  </footer>

  <script>
    function handleContactSubmit(event) {
      event.preventDefault();
      alert('Thank you for contacting TravelBloom! We will get back to you shortly.');
      document.getElementById('contactForm').reset();
    }
  </script>
</body>
</html>
